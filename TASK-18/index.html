<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>DOM Manipulation and Event Handling</title>
  </head>
  <body>
    <header><span><h1>Hello</h1><h1 id="name"></h1></span></header>
    <main>
      <div class="container">
        <div class="box" id="red">red</div>
        <div class="box" id="blue">blue</div>

        <div class="box" id="yellow">yellow</div>
      </div>
      <div class="greet">
        <input id="greet-bar" type="text">
        <button onclick="greet()" id="greet-btn">Greet!</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
