<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Laundry Mart | Login Page</title>
</head>
<body>
    <main>
        <div class="laundry-image"></div>
        <div class="login-form">
            <h1>Hello Again!</h1>
            <p class="greet">Welcome Back! We missed you!</p>
            <form>
                <label for="">Email</label>
                <input placeholder="Email@site.com" type="text">
                <label for="">Password</label>
                <input placeholder="Password" type="password">
                <a id="forget-password" href="#">Forget Password</a>
                <button id="login-btn">Login</button>
                <p class="cta">Not a member? <a href="">Register Now</a></p>
            </form>
        </div>
    </main>
</body>
</html>
